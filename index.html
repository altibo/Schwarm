<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07061a" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" />
<title>SCHWARM · KI-DJ (Phase 0)</title>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <strong class="logo">SCHWARM</strong>
    <span class="tag">Phase 0 · Testversion · Crowd simuliert</span>
    <nav><a href="./test.html">Blindtest</a><a href="./guest.html">Teilnehmer-Ansicht</a></nav>
  </header>
  <section class="stage">
    <div class="status">
      <div class="level" id="level" aria-label="Energiestufe">1</div>
      <div class="stat">
        <div class="phase" id="phase">Bereit</div>
        <div class="meta" id="meta">— BPM · Takt —</div>
      </div>
      <div class="bars">
        <label>Drop-Bereitschaft <span id="readyTxt">0 %</span></label>
        <div class="meter"><i id="ready"></i></div>
        <label>Müdigkeit <span id="fatTxt">0</span></label>
        <div class="meter fat"><i id="fat"></i></div>
      </div>
    </div>
    <canvas id="curve" class="curve" aria-label="Energiekurve"></canvas>
    <p class="event" id="event">Soll-Kurve (weiß), Musikstufe (Farbe), Crowd-Energie (türkis), Drops (◆)</p>
  </section>
  <section class="controls">
    <div class="row">
      <button id="play" class="btn play">▶ Play</button>
      <button id="drop" class="btn drop">Drop jetzt erzwingen</button>
    </div>
    <div class="row seg" id="presets"></div>
    <div class="row seg">
      <button class="btn small" id="modeManual" aria-pressed="true">Crowd: Regler</button>
      <button class="btn small" id="modeSim" aria-pressed="false">Crowd: Simulation</button>
    </div>
    <label class="slider">Crowd-Energie <output id="eOut">3,0</output>
      <input id="energy" type="range" min="0" max="10" step="0.1" value="3" /></label>
    <label class="slider">Gleichtakt <output id="sOut">30 %</output>
      <input id="sync" type="range" min="0" max="1" step="0.01" value="0.3" /></label>
    <label class="slider">Anzahl Tänzer <output id="nOut">12</output>
      <input id="n" type="range" min="0" max="1" step="0.001" value="0.29" /></label>
    <p class="rule" id="rule"></p>
  </section>
</main>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
